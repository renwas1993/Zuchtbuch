const fmt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('de-AT'): '–';
const num=(n)=>Number.isFinite(Number(n)) ? Number(n) : 0;
const id=()=>('K'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)).toUpperCase();
const findAnimal=k=>db.animals.find(a=>a.id===k);
const findGroup=k=>db.groups.find(g=>g.id===k);
const aname=k=>findAnimal(k)?.name||'Nicht bekannt';

const opts=(items,value='',unknown='Bitte wählen')=>`<option value="">${esc(unknown)}</option>`+items.map(x=>`<option value="${esc(x.value)}" ${x.value===value?'selected':''}>${esc(x.label)}</option>`).join('');
const ao=(val,except='')=>opts(db.animals.filter(a=>a.id!==except).map(a=>({value:a.id,label:`${a.code} · ${a.name}`})),val,'Unbekannt / nicht erfasst');
const go=val=>opts(db.groups.map(g=>({value:g.id,label:g.name})),val,'Kein Zuchtstamm');
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3400)}
function store(){try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true;return true}catch(e){storageOK=false;toast('Speichern nicht möglich. Bitte die JSON-Sicherung nutzen.');return false}}
function load(){try{const raw=localStorage.getItem(KEY);db=raw?JSON.parse(raw):fresh();if(!raw)store();if(!isValid(db)){db=fresh();store();}}catch(e){storageOK=false;db=fresh()}}
function isValid(x){return !!(x&&x.version===1&&['groups','animals','broods','health','sales'].every(k=>Array.isArray(x[k])))}
const b=(label,action,param='',klass='small')=>`<button type="button" class="btn ${klass}" data-action="${action}" data-id="${esc(param)}">${label}</button>`;
const title=(h,sub,right='')=>`<div class="page-head"><div><h1>${h}</h1><p>${sub}</p></div>${right}</div>`;
function save(){const persisted=store();editing='';render();toast(persisted?'Gespeichert ✓':'Eintrag nur vorläufig – bitte JSON-Sicherung herunterladen!')}
function nav(n){view=n;editing='';query='';render();scrollTo(0,0)}
const activeAnimals=()=>db.animals.filter(a=>a.status!=='Verkauft'&&a.status!=='Verstorben');
function headButtons(){const tabs=[...document.querySelectorAll('[data-nav]')];tabs.forEach(x=>{let n=x.dataset.nav;if(x.classList.contains('tab'))x.classList.toggle('active',n===view||n==='mehr'&&['mehr','gesundheit','verkaeufe','sicherung'].includes(view))})}

function animalCard(a){return `<article class="card"><div class="card-top"><div><div class="tag-count">${esc(a.code)}</div><div class="card-title">${esc(a.name)}</div><div class="meta">${esc(a.sex)} · ${esc(a.age|| (a.hatched?fmt(a.hatched):'Alter offen'))}</div></div><span class="badge">${esc(a.status||'Aktiv')}</span></div><div class="chips"><span class="chip">${esc(gname(a.groupId))}</span>${a.ring?`<span class="chip ok">Ring: ${esc(a.ring)}</span>`:`<span class="chip warn">Ring offen</span>`}${a.colour?`<span class="chip">${esc(a.colour)}</span>`:''}</div><div class="fine">Vater: ${esc(aname(a.fatherId))} · Mutter: ${esc(aname(a.motherId))}</div>${a.notes?`<p class="meta">${esc(a.notes)}</p>`:''}<div class="actions">${b('Bearbeiten','edit-animal',a.id)}${b('Gesundheit ＋','health-for',a.id)}${b('Verkauf ＋','sale-for',a.id)}</div></article>`}
function animalForm(a){const x=a||{};return `<form id="animal-form" class="panel form-panel"><div class="form-title"><h2>${a?'Tier bearbeiten':'Neues Tier erfassen'}</h2>${b('Abbrechen','cancel')}</div><div class="form-grid">
<div class="field"><label for="acode">Interne Tier-ID *</label><input id="acode" name="code" value="${esc(x.code||`P26-${String(db.animals.length+1).padStart(3,'0')}`)}" required></div><div class="field"><label for="aname">Name / Bezeichnung *</label><input id="aname" name="name" value="${esc(x.name)}" placeholder="z. B. Henne blau 1" required></div>
<div class="field"><label>Geschlecht</label><select name="sex">${['Unbekannt','Hahn','Henne'].map(z=>`<option ${x.sex===z?'selected':''}>${z}</option>`).join('')}</select></div><div class="field"><label>Zuchtstamm</label><select name="groupId">${go(x.groupId)}</select></div>
<div class="field"><label>Schlupfdatum (wenn bekannt)</label><input type="date" name="hatched" value="${esc(x.hatched)}"></div><div class="field"><label>Alter, falls nur geschätzt</label><input name="age" value="${esc(x.age)}" placeholder="z. B. ca. 8 Wochen"></div>
<div class="field"><label>RÖK-Ringnummer / Kennzeichnung</label><input name="ring" value="${esc(x.ring)}" placeholder="Eintragen, sobald vorhanden"></div><div class="field"><label>Farbe / Farbschlag</label><input name="colour" value="${esc(x.colour)}"></div>
<div class="field"><label>Vater</label><select name="fatherId">${ao(x.fatherId,a?.id)}</select></div><div class="field"><label>Mutter</label><select name="motherId">${ao(x.motherId,a?.id)}</select></div>
<div class="field"><label>Herkunft / Züchter</label><input name="origin" value="${esc(x.origin)}"></div><div class="field"><label>Status</label><select name="status">${['Aktiv','Aufzucht','Reserve','Verkauft','Verstorben'].map(z=>`<option ${x.status===z?'selected':''}>${z}</option>`).join('')}</select></div>
<div class="field wide"><label>Notizen / Besonderheiten</label><textarea name="notes">${esc(x.notes)}</textarea><small>Unbekannte Abstammung bitte nicht schätzen.</small></div></div><div class="actions"><button class="btn primary" type="submit">Tier speichern</button>${a?b('Tier löschen','delete-animal',a.id,'small danger'):''}</div></form>`}
function renderAnimals(){const visible=db.animals.filter(a=>(a.name+' '+a.code+' '+a.ring).toLowerCase().includes(query.toLowerCase()));return `${title('Meine Tiere','Jedes Tier hat eine eigene Kartei mit Abstammung und Ringnummer.',b('＋ Tier','add-animal','','primary'))}${editing==='new-animal'||editing.startsWith('animal:')?animalForm(db.animals.find(a=>a.id===editing.split(':')[1])):''}<div class="field" style="margin-bottom:15px"><label for="query">Tiere suchen</label><input id="query" placeholder="Name, Tier-ID oder Ringnummer" value="${esc(query)}"></div>${visible.length?visible.map(animalCard).join(''):'<div class="empty">Noch keine passenden Tiere vorhanden.</div>'}<div class="info">Die angelegten IDs P26-001 bis P26-005 sind interne Hilfsnummern, keine offiziellen RÖK-Ringe. Eltern nur eintragen, wenn die Abstammung sicher bekannt ist.</div>`}
function relativeWarning(rooster,hen){if(!rooster||!hen) return '';
if(rooster.id===hen.id)return 'Identisches Tier';
if([hen.fatherId,hen.motherId].includes(rooster.id)||[rooster.fatherId,rooster.motherId].includes(hen.id))return 'Elternteil / Nachwuchs';
const rp=[rooster.fatherId,rooster.motherId].filter(Boolean),hp=[hen.fatherId,hen.motherId].filter(Boolean);
if(rp.some(p=>hp.includes(p)))return 'Gemeinsames Elternteil';
if(hp.some(p=>[findAnimal(rooster.fatherId)?.fatherId,findAnimal(rooster.fatherId)?.motherId,findAnimal(rooster.motherId)?.fatherId,findAnimal(rooster.motherId)?.motherId].filter(Boolean).includes(p)))return 'Großeltern-Verwandtschaft möglich';
if(rp.some(p=>[findAnimal(hen.fatherId)?.fatherId,findAnimal(hen.fatherId)?.motherId,findAnimal(hen.motherId)?.fatherId,findAnimal(hen.motherId)?.motherId].filter(Boolean).includes(p)))return 'Großeltern-Verwandtschaft möglich';
return ''}
function groupCard(g){const aa=db.animals.filter(a=>a.groupId===g.id&&a.status!=='Verkauft'&&a.status!=='Verstorben');let h=aa.filter(a=>a.sex==='Hahn'),hens=aa.filter(a=>a.sex==='Henne'),known=h.flatMap(r=>hens.map(he=>({r,he,reason:relativeWarning(r,he)}))).filter(o=>o.reason);return `<article class="card"><div class="card-top"><div><div class="card-title">${esc(g.name)}</div><div class="meta">${esc(g.status)} · ${aa.length} Tiere (${h.length} Hahn / ${hens.length} Hennen)</div></div><span class="badge">${esc(g.id)}</span></div><p class="muted">${esc(g.notes||'Keine Anmerkungen.')}</p><div class="chips">${aa.map(a=>`<span class="chip ${a.sex==='Hahn'?'blue':''}">${esc(a.name)}</span>`).join('')||'<span class="chip">Noch keine Tiere zugeordnet</span>'}</div>${known.length?`<div class="notice"><strong>Verwandtschafts-Hinweis:</strong> ${known.map(o=>esc(o.r.name+' / '+o.he.name+': '+o.reason)).join('; ')}. Paarung prüfen!</div>`:''}<div class="actions">${b('Bearbeiten','edit-group',g.id)}${b('Brut erfassen','brood-for',g.id)}</div></article>`}
function groupForm(g){const x=g||{};return `<form id="group-form" class="panel form-panel"><div class="form-title"><h2>${g?'Zuchtstamm bearbeiten':'Neuer Zuchtstamm'}</h2>${b('Abbrechen','cancel')}</div><div class="form-grid"><div class="field"><label>Name *</label><input name="name" value="${esc(x.name||'Zuchtstamm '+(db.groups.length+1))}" required></div><div class="field"><label>Status</label><select name="status">${['Geplant','Aktiv','Pausiert'].map(z=>`<option ${x.status===z?'selected':''}>${z}</option>`).join('')}</select></div><div class="field wide"><label>Notizen</label><textarea name="notes">${esc(x.notes)}</textarea></div></div><div class="actions"><button type="submit" class="btn primary">Stamm speichern</button>${g?b('Stamm löschen','delete-group',g.id,'small danger'):''}</div></form>`}
function renderGroups(){return `${title('Zuchtstämme','Plane deine Verpaarungen – auch für weitere Stämme.',b('＋ Stamm','add-group','','primary'))}${editing==='new-group'||editing.startsWith('group:')?groupForm(db.groups.find(g=>g.id===editing.split(':')[1])):''}${db.groups.map(groupCard).join('')||'<div class="empty">Noch keine Stämme vorhanden.</div>'}<div class="info">Eine Warnung erscheint bei bestimmten bekannten Verwandtschaftsverhältnissen. <strong>Keine Warnung bedeutet nicht automatisch, dass Tiere unverwandt sind.</strong> Die Funktion ersetzt keine vollständige Stammbaumprüfung.</div>`}
function broodCard(o){const e=num(o.eggs),d=o.developing===''?'?':num(o.developing),h=o.hatched===''?'?':num(o.hatched),pc=h==='?'?'–':e?Math.round(h/e*100)+' %':'–';const end=o.start?new Date(new Date(o.start+'T12:00:00').getTime()+21*86400000).toISOString().slice(0,10):'';return `<article class="card"><div class="card-top"><div><div class="tag-count">${esc(o.code)}</div><div class="card-title">${esc(gname(o.groupId))}</div><div class="meta">Brutbeginn ${fmt(o.start)} · voraussichtlicher Schlupf ca. ${fmt(end)}</div></div><span class="badge">${pc}</span></div><div class="grid" style="margin:13px 0"><div class="stat"><strong>${e}</strong><span>Eier eingelegt</span></div><div class="stat"><strong>${d}</strong><span>Entwickelt</span></div><div class="stat"><strong>${h}</strong><span>Geschlüpft</span></div><div class="stat"><strong>${o.healthy===''?'?':num(o.healthy)}</strong><span>Gesund</span></div></div><p class="fine">Vater: ${esc(aname(o.fatherId))} · Mutter: ${esc(aname(o.motherId))}</p>${o.notes?`<p class="muted">${esc(o.notes)}</p>`:''}<div class="actions">${b('Brut aktualisieren','edit-brood',o.id)}${b('Löschen','delete-brood',o.id,'small danger')}</div></article>`}
function broodForm(o){const x=o||{};return `<form id="brood-form" class="panel form-panel"><div class="form-title"><h2>${o?'Brut bearbeiten':'Neue Brut'}</h2>${b('Abbrechen','cancel')}</div><div class="form-grid"><div class="field"><label>Brut-Nr. *</label><input name="code" value="${esc(x.code||'BR-'+String(db.broods.length+1).padStart(3,'0'))}" required></div><div class="field"><label>Zuchtstamm</label><select name="groupId">${go(x.groupId)}</select></div><div class="field"><label>Brutbeginn *</label><input name="start" type="date" value="${esc(x.start)}" required></div><div class="field"><label>Eier eingelegt *</label><input name="eggs" type="number" min="0" step="1" value="${esc(x.eggs??6)}" required></div><div class="field"><label>Mit Entwicklung beim Schieren</label><input name="developing" type="number" min="0" step="1" value="${esc(x.developing)}" placeholder="Noch offen"></div><div class="field"><label>Küken geschlüpft</label><input name="hatched" type="number" min="0" step="1" value="${esc(x.hatched)}" placeholder="Noch offen"></div><div class="field"><label>Gesunde Küken</label><input name="healthy" type="number" min="0" step="1" value="${esc(x.healthy)}" placeholder="Noch offen"></div><div class="field"><label>Vater (nur wenn sicher)</label><select name="fatherId">${ao(x.fatherId)}</select></div><div class="field"><label>Mutter (nur wenn sicher)</label><select name="motherId">${ao(x.motherId)}</select></div><div class="field wide"><label>Notizen, Auffälligkeiten, Schierdaten</label><textarea name="notes">${esc(x.notes)}</textarea></div></div><div class="info" style="margin-top:12px">Der errechnete Schlupftermin ist ein Richtwert (ca. 21 Tage). „Entwickelt“ beim Schieren beweist nicht in jedem Fall eine sichere Befruchtung. Bei gemeinsam legenden Hennen die Mutter nur angeben, wenn sie eindeutig zugeordnet werden kann.</div><div class="actions"><button class="btn primary" type="submit">Brut speichern</button></div></form>`}
function renderBroods(){let eggs=db.broods.reduce((s,o)=>s+num(o.eggs),0),hatched=db.broods.reduce((s,o)=>s+num(o.hatched),0);return `${title('Meine Bruten','Bruteier und Schlupfergebnisse übersichtlich dokumentieren.',b('＋ Brut','add-brood','','primary'))}<div class="grid stats"><div class="stat"><strong>${db.broods.length}</strong><span>Bruten</span></div><div class="stat"><strong>${eggs}</strong><span>Eier eingelegt</span></div><div class="stat"><strong>${hatched}</strong><span>Küken geschlüpft</span></div><div class="stat"><strong>${eggs&&db.broods.every(o=>o.hatched!=='')?Math.round(hatched/eggs*100)+' %':'–'}</strong><span>Schlupfrate gesamt</span></div></div>${editing==='new-brood'||editing.startsWith('brood:')?broodForm(db.broods.find(o=>o.id===editing.split(':')[1])):''}${db.broods.length?db.broods.slice().sort((a,b)=>b.start.localeCompare(a.start)).map(broodCard).join(''):'<div class="empty">Noch keine Brut eingetragen. Sobald du deine ersten Bruteier einlegst, erfasst du sie hier. 🐣</div>'}`}
function healthForm(o){let x=o||{};return `<form id="health-form" class="panel form-panel"><div class="form-title"><h2>${o?'Eintrag bearbeiten':'Gesundheitseintrag'}</h2>${b('Abbrechen','cancel')}</div><div class="form-grid"><div class="field"><label>Tier *</label><select name="animalId" required>${ao(x.animalId)}</select></div><div class="field"><label>Datum *</label><input type="date" name="date" value="${esc(x.date||new Date().toISOString().slice(0,10))}" required></div><div class="field wide"><label>Art</label><select name="kind">${['Beobachtung','Behandlung','Impfung','Gewicht / Entwicklung','Sonstiges'].map(z=>`<option ${x.kind===z?'selected':''}>${z}</option>`).join('')}</select></div><div class="field wide"><label>Notiz *</label><textarea name="notes" required>${esc(x.notes)}</textarea></div></div><div class="actions"><button class="btn primary" type="submit">Eintrag speichern</button></div></form>`}
function renderHealth(){return `${title('Gesundheit','Beobachtungen, Behandlungen und Entwicklung festhalten.',b('＋ Eintrag','add-health','','primary'))}${editing==='new-health'||editing.startsWith('health:')?healthForm(db.health.find(o=>o.id===editing.split(':')[1])):''}${db.health.length?db.health.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(o=>`<article class="card"><div class="card-top"><div><div class="tag-count">${fmt(o.date)} · ${esc(o.kind)}</div><div class="card-title">${esc(aname(o.animalId))}</div></div>${b('Bearbeiten','edit-health',o.id)}</div><p>${esc(o.notes)}</p>${b('Löschen','delete-health',o.id,'small danger')}</article>`).join(''):'<div class="empty">Bisher keine Gesundheitseinträge.</div>'}`}
function salesForm(o){const x=o||{};return `<form id="sales-form" class="panel form-panel"><div class="form-title"><h2>${o?'Verkauf bearbeiten':'Verkauf erfassen'}</h2>${b('Abbrechen','cancel')}</div><div class="form-grid"><div class="field"><label>Tier *</label><select name="animalId" required>${ao(x.animalId)}</select></div><div class="field"><label>Abgabedatum *</label><input type="date" name="date" value="${esc(x.date||new Date().toISOString().slice(0,10))}" required></div><div class="field"><label>Preis in Euro</label><input type="number" name="price" min="0" step="0.01" value="${esc(x.price)}" placeholder="Optional"></div><div class="field"><label>Käufer / Kontakt (optional)</label><input name="buyer" value="${esc(x.buyer)}"></div><div class="field wide"><label>Notizen (z. B. Geschlecht unbekannt)</label><textarea name="notes">${esc(x.notes)}</textarea></div></div><div class="actions"><button class="btn primary" type="submit">Verkauf speichern</button></div></form>`}
function renderSales(){const sum=db.sales.reduce((s,o)=>s+num(o.price),0);return `${title('Verkäufe','Nachvollziehen, welche Tiere wann abgegeben wurden.',b('＋ Verkauf','add-sale','','primary'))}<div class="grid stats"><div class="stat"><strong>${db.sales.length}</strong><span>Einträge</span></div><div class="stat"><strong>${sum.toLocaleString('de-AT',{style:'currency',currency:'EUR',maximumFractionDigits:0})}</strong><span>Summe eingetragener Verkäufe</span></div></div>${editing==='new-sale'||editing.startsWith('sale:')?salesForm(db.sales.find(o=>o.id===editing.split(':')[1])):''}${db.sales.length?db.sales.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(o=>`<article class="card"><div class="card-top"><div><div class="card-title">${esc(aname(o.animalId))}</div><div class="meta">${fmt(o.date)} · ${o.price!==''?num(o.price).toLocaleString('de-AT',{style:'currency',currency:'EUR'}):'Preis offen'}</div></div>${b('Bearbeiten','edit-sale',o.id)}</div>${o.buyer?`<p><strong>Käufer:</strong> ${esc(o.buyer)}</p>`:''}${o.notes?`<p class="muted">${esc(o.notes)}</p>`:''}${b('Löschen','delete-sale',o.id,'small danger')}</article>`).join(''):'<div class="empty">Noch keine Verkäufe erfasst.</div>'}<div class="info">Die Verkaufsübersicht ist eine private Dokumentation und ersetzt keine gegebenenfalls gesetzlich notwendigen Aufzeichnungen.</div>`}
function renderMore(){return `${title('Weitere Bereiche','Alle wichtigen Aufzeichnungen an einem Ort.')}<div class="panel"><div class="listrow"><div><strong>❤ Gesundheit</strong><div class="meta">Beobachtungen, Behandlungen, Impfungen</div></div>${b('Öffnen','go','gesundheit')}</div><div class="listrow"><div><strong>€ Verkäufe</strong><div class="meta">Abgabe, Preise, Käufer</div></div>${b('Öffnen','go','verkaeufe')}</div><div class="listrow"><div><strong>⇩ Sicherung & Wiederherstellen</strong><div class="meta">Daten aufbewahren oder übertragen</div></div>${b('Öffnen','go','sicherung')}</div></div><div class="panel"><h2>Wichtig für deine Zucht</h2><p>Beim Nachziehen die Abstammung sauber dokumentieren, besonders bei Hennen aus Stamm 1, die später mit dem Hahn von Stamm 2 verpaart werden sollen.</p><p class="muted">Das Zuchtbuch ist ein privates Hilfsmittel und keine offizielle Zuchtvereins-Software.</p></div>`}
function renderBackup(){return `${title('Datensicherung','Einfach sichern und bei Bedarf auf einem anderen Gerät importieren.')}<div class="panel"><h2>1. Sicherungsdatei erstellen</h2><p>Speichert alle Tierkarten, Zuchtstämme, Bruten, Gesundheitsnotizen und Verkäufe in einer <strong>JSON-Datei</strong>. Die Datei kannst du auf dem iPhone unter „Dateien“ oder in iCloud Drive aufbewahren.</p><div class="actions">${b('⇩ Jetzt Sicherung herunterladen','export','','primary')}${b('🖨 Übersicht drucken','print')}</div></div><div class="panel"><h2>2. Sicherung wiederherstellen</h2><p>Eine vorhandene Sicherung lässt sich wieder einlesen, etwa auf einem neuen iPhone. <strong>Achtung:</strong> Der Import ersetzt die Daten auf diesem Gerät.</p><div class="actions">${b('⇧ JSON-Sicherung auswählen','import','','gold')}</div></div><div class="panel"><h2>3. Das solltest du wissen</h2><div class="rowline"><span>Speicherung</span><strong>Nur im aktuellen Browser</strong></div><div class="rowline"><span>Cloud-Synchronisierung</span><strong>Nicht vorhanden</strong></div><div class="rowline"><span>Internet</span><strong>Nach Installation meist nicht nötig</strong></div><div class="rowline"><span>Daten übertragen</span><strong>Über Sicherungsdatei</strong></div><p class="notice" style="margin-top:14px">Browserdaten können bei Löschen von Website-Daten, Privatmodus oder Gerätewechsel verloren gehen. Sichere deine Daten regelmäßig extern. Öffnen über die iPhone-Dateivorschau kann die Speichern-Funktion einschränken; am zuverlässigsten ist die Nutzung als gehostete Webseite über Safari.</p></div><div class="panel"><h2>iPhone-Tipp</h2><p>Wenn die App über eine Internetadresse (HTTPS) bereitgestellt wird: in <strong>Safari → Teilen → Zum Home-Bildschirm</strong>. Dann erscheint dein eigenes Zuchtbuch mit Logo als App-Symbol.</p></div>`}
function checkCounts(form){const n=k=>form.elements[k]?.value?.trim()||'';if(n('eggs')==='')return true;let eggs=num(n('eggs')),dev=n('developing'),hat=n('hatched'),hl=n('healthy');if(dev!==''&&num(dev)>eggs){toast('Entwickelte Eier können nicht mehr als eingelegte Eier sein.');return false}if(hat!==''&&num(hat)>eggs){toast('Geschlüpfte Küken können nicht mehr als eingelegte Eier sein.');return false}if(hl!==''&&hat!==''&&num(hl)>num(hat)){toast('Gesunde Küken können nicht mehr als geschlüpfte Küken sein.');return false}return true}
function formData(form,fields){const out={};for(const f of fields){out[f]=form.elements[f]?.value?.trim()??''}return out}
function onSubmit(e){const f=e.target;if(!f.matches('form'))return;e.preventDefault();let m={
'animal-form':['animals',['code','name','sex','groupId','age','hatched','colour','ring','origin','fatherId','motherId','notes','status'],'animal:'],
'group-form':['groups',['name','status','notes'],'group:'],
'brood-form':['broods',['code','groupId','start','eggs','developing','hatched','healthy','notes','fatherId','motherId'],'brood:'],
'health-form':['health',['animalId','date','kind','notes'],'health:'],
'sales-form':['sales',['animalId','date','price','buyer','notes'],'sale:']
}[f.id];if(!m)return;
if(f.id==='brood-form'&&!checkCounts(f))return;
let [collection,fields,prefix]=m,values=formData(f,fields),itemId=editing.startsWith(prefix)?editing.slice(prefix.length):'',existing=db[collection].find(x=>x.id===itemId);
if(f.id==='animal-form'){
 if(db.animals.some(a=>a.code.toLowerCase()===values.code.toLowerCase()&&a.id!==itemId)){toast('Die interne Tier-ID gibt es bereits.');return}
 if(values.fatherId&&values.fatherId===values.motherId){toast('Vater und Mutter können nicht dasselbe Tier sein.');return}
 if(itemId&&(values.fatherId===itemId||values.motherId===itemId)){toast('Ein Tier kann nicht sein eigenes Elternteil sein.');return}}
if(f.id==='brood-form'&&db.broods.some(a=>a.code.toLowerCase()===values.code.toLowerCase()&&a.id!==itemId)){toast('Diese Brutnummer gibt es bereits.');return}
if(f.id==='health-form'&&!values.animalId){toast('Bitte ein Tier auswählen.');return}
if(f.id==='sales-form'&&!values.animalId){toast('Bitte ein Tier auswählen.');return}
if(existing){Object.assign(existing,values)}else{db[collection].push({id:id(),...values})}
if(f.id==='sales-form'&&values.animalId){const animal=findAnimal(values.animalId);if(animal)animal.status='Verkauft'}
save()}
function download(filename,content,mime='application/json'){const blob=new Blob([content],{type:mime}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500)}
function exportJSON(){const stamp=new Date().toISOString().slice(0,10);download(`Pichlwanger_Seidenhuehner_Sicherung_${stamp}.json`,JSON.stringify(db,null,2));toast('Sicherungsdatei erstellt. Bitte sicher ablegen.')}
function onAction(action,aid){switch(action){
 case 'go':nav(aid);return;
 case 'cancel':editing='';render();return;
 case 'add-animal':view='tiere';editing='new-animal';break;
 case 'edit-animal':view='tiere';editing='animal:'+aid;break;
 case 'add-group':view='staemme';editing='new-group';break;
 case 'edit-group':view='staemme';editing='group:'+aid;break;
 case 'add-brood':view='bruten';editing='new-brood';break;
 case 'edit-brood':view='bruten';editing='brood:'+aid;break;
 case 'brood-for':view='bruten';editing='new-brood';render();if(el.querySelector('[name="groupId"]'))el.querySelector('[name="groupId"]').value=aid;window.scrollTo(0,0);return;
 case 'add-health':view='gesundheit';editing='new-health';break;
 case 'health-for':view='gesundheit';editing='new-health';render();if(el.querySelector('[name="animalId"]'))el.querySelector('[name="animalId"]').value=aid;window.scrollTo(0,0);return;
 case 'edit-health':view='gesundheit';editing='health:'+aid;break;
 case 'add-sale':view='verkaeufe';editing='new-sale';break;
 case 'sale-for':view='verkaeufe';editing='new-sale';render();if(el.querySelector('[name="animalId"]'))el.querySelector('[name="animalId"]').value=aid;window.scrollTo(0,0);return;
 case 'edit-sale':view='verkaeufe';editing='sale:'+aid;break;
 case 'export':exportJSON();return;
 case 'import':document.getElementById('backupfile').click();return;
 case 'print':window.print();return;
 case 'delete-animal':{let a=findAnimal(aid);if(!a)return;if(db.animals.some(x=>x.fatherId===aid||x.motherId===aid)||db.sales.some(x=>x.animalId===aid)||db.health.some(x=>x.animalId===aid)||db.broods.some(x=>x.fatherId===aid||x.motherId===aid)){toast('Dieses Tier ist verknüpft. Bitte zuerst die zugehörigen Einträge prüfen.');return}if(!confirm(`Tier „${a.name}“ wirklich endgültig löschen?`))return;db.animals=db.animals.filter(x=>x.id!==aid);save();return}
 case 'delete-group':{const g=findGroup(aid);if(!g)return;if(db.animals.some(x=>x.groupId===aid)||db.broods.some(x=>x.groupId===aid)){toast('Diesem Stamm sind Tiere oder Bruten zugeordnet. Erst umordnen.');return}if(!confirm(`„${g.name}“ löschen?`))return;db.groups=db.groups.filter(x=>x.id!==aid);save();return}
 case 'delete-brood':if(!confirm('Brut wirklich löschen?'))return;db.broods=db.broods.filter(x=>x.id!==aid);save();return;
 case 'delete-health':if(!confirm('Gesundheitseintrag wirklich löschen?'))return;db.health=db.health.filter(x=>x.id!==aid);save();return;
 case 'delete-sale':if(!confirm('Verkaufseintrag wirklich löschen? Der Tierstatus wird nicht automatisch geändert.'))return;db.sales=db.sales.filter(x=>x.id!==aid);save();return;
 default:return;
}render();window.scrollTo(0,0)}
function onClick(e){const n=e.target.closest('[data-nav]');if(n){nav(n.dataset.nav);return}const a=e.target.closest('[data-action]');if(a){onAction(a.dataset.action,a.dataset.id||'')}}
function onImport(ev){const file=ev.target.files[0];if(!file)return;if(file.size>10*1024*1024){toast('Sicherungsdatei zu groß.');ev.target.value='';return}const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(!isValid(parsed))throw Error('invalid');const ok=confirm(`Sicherung importieren?\n${parsed.animals.length} Tiere, ${parsed.groups.length} Stämme, ${parsed.broods.length} Bruten.\n\nACHTUNG: Die bisherigen Einträge auf diesem Gerät werden ersetzt!`);if(!ok)return;db=parsed;view='start';editing='';store();render();toast('Sicherung erfolgreich eingelesen.')}catch(e){toast('Diese Datei ist keine gültige Zuchtbuch-Sicherung.')}finally{ev.target.value=''}};reader.readAsText(file)}
document.addEventListener('click',onClick);document.addEventListener('submit',onSubmit);document.getElementById('backupfile').addEventListener('change',onImport);document.addEventListener('input',e=>{if(e.target.id==='query'){const caret=e.target.selectionStart;query=e.target.value;const where=window.scrollY;render();const newInput=document.getElementById('query');if(newInput){newInput.focus();newInput.setSelectionRange(caret,caret);window.scrollTo(0,where)}}});
load();render();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body></html>
